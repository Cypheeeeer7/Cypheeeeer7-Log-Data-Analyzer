<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypher7 - Log & Data Analyzer</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #00ff66;
            --text-color: #c9d1d9;
            --border-color: #30363d;
            --error-color: #ff4d4d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--accent-color);
            letter-spacing: 2px;
            margin: 0;
        }

        .upload-section {
            background: var(--card-bg);
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-section:hover {
            border-color: var(--accent-color);
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .results {
            margin-top: 30px;
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-card h3 {
            margin: 0;
            font-size: 24px;
            color: var(--accent-color);
        }

        .stat-card.error h3 {
            color: var(--error-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-family: monospace;
            font-size: 13px;
        }

        th {
            background-color: #21262d;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CYPHER7 // ANALYZER</h1>
        <p>Real-time system log and data analysis tool</p>
    </header>

    <div class="upload-section" onclick="document.getElementById('fileInput').click()">
        <p>Click here or drag a file to analyze (.csv, .log, .txt)</p>
        <input type="file" id="fileInput" onchange="uploadFile()">
        <button class="btn">Select File</button>
    </div>

    <div class="results" id="resultsSection">
        <h2>Analysis Results</h2>
        <div class="stats-grid">
            <div class="stat-card">
                <p>File Name</p>
                <h3 id="fileName">-</h3>
            </div>
            <div class="stat-card">
                <p>Total Rows</p>
                <h3 id="totalRows">0</h3>
            </div>
            <div class="stat-card error">
                <p>Detected Errors</p>
                <h3 id="errorCount">0</h3>
            </div>
        </div>

        <h3>Data Preview (First 10 Rows)</h3>
        <div style="overflow-x: auto;">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
async function uploadFile() {
    const fileInput = document.getElementById('fileInput');
    if (!fileInput.files.length) return;

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    try {
        const response = await fetch('/analyze', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (data.success) {
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('fileName').innerText = data.filename;
            document.getElementById('totalRows').innerText = data.total_rows;
            document.getElementById('errorCount').innerText = data.error_count;

            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');
            
            tableHead.innerHTML = '';
            tableBody.innerHTML = '';

            let headerRow = '<tr>';
            data.columns.forEach(col => headerRow += `<th>${col}</th>`);
            headerRow += '</tr>';
            tableHead.innerHTML = headerRow;

            data.preview.forEach(row => {
                let bodyRow = '<tr>';
                data.columns.forEach(col => bodyRow += `<td>${row[col] || ''}</td>`);
                bodyRow += '</tr>';
                tableBody.innerHTML += bodyRow;
            });
        } else {
            alert(data.error);
        }
    } catch (err) {
        alert('An error occurred while communicating with the server.');
    }
}
</script>

</body>
</html>
